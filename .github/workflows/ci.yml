name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm test

      - name: Verify bundled editor
        run: npm run test:artifact

      # The release gate runs these too; running them here keeps a browser failure out of release day.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance checks
        run: npm run test:consumer && npm run test:hosted
